name: Strategy Engine validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e .
      - name: Compile all Python
        run: python -m compileall -q src scripts tests
      - name: Full unit test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Safety invariant
        run: |
          if grep -R --line-number --fixed-string 'trade_entry_allowed=True' src scripts tests; then
            echo 'Forbidden real-entry enablement found.' >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          text='\n'.join(p.read_text(encoding='utf-8',errors='ignore') for p in Path('src').rglob('*.py'))
          assert 'trade_entry_allowed=True' not in text
          print('SAFETY PASS: no trade_entry_allowed=True in src')
          PY
