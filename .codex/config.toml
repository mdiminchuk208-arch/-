#:schema https://developers.openai.com/codex/config-schema.json

persistent_instructions = "Follow AGENTS.md and agent_control/*.md. Preserve every frozen artifact and frozen strategy rule. Optimize for the fastest safe path to a working Crypto Bot: remove launch blockers, do not redesign/tune MACHINE_STRATEGY_v3 unless a future explicit pre-outcome strategy gate authorizes it. Keep all 22 specialist roles available, but use only 2-3 active agents for normal work and never exceed 4 concurrent threads. For venue collection, run at most 2 venue_researcher workers concurrently and process venues in small batches. Parallelize only genuinely independent work. Keep worker context narrow: do not reread frozen strategy/history artifacts unless strictly required. Use high reasoning only for key synthesis/audit/reviewer roles; use medium reasoning for routine venue/source collection where configured. Checkpoint durable evidence after each small batch so interrupted runs do not repeat completed research. Require independent review for critical claims. Never enable live trading without the required qualification gates and explicit user authorization."

[features]
multi_agent = true

[agents]
max_threads = 4
max_depth = 1

[agents.strategy_explorer]
description = "Read-only strategy diagnostics explorer for frozen backtest and robustness artifacts."
config_file = "agents/strategy-explorer.toml"

[agents.strategy_designer]
description = "Pre-outcome machine strategy designer. Proposes causally justified rules only after audit evidence is frozen; do not use for current launch path unless explicitly authorized."
config_file = "agents/strategy-designer.toml"

[agents.backtest_reviewer]
description = "Independent reviewer for no-lookahead, leakage, reproducibility, overfit, and metric correctness."
config_file = "agents/backtest-reviewer.toml"

[agents.execution_auditor]
description = "Execution and accounting auditor for LONG/SHORT symmetry, fees, slippage, fills, stops, targets, and metadata assumptions."
config_file = "agents/execution-auditor.toml"

[agents.market_regime_researcher]
description = "Read-only causal market-regime researcher for trend/range/transition/uncertain state definitions and direction symmetry."
config_file = "agents/market-regime-researcher.toml"

[agents.historical_data_engineer]
description = "Historical market-data adapter engineer for causal bars, aggregation, continuity, provenance, and deterministic event construction."
config_file = "agents/historical-data-engineer.toml"

[agents.tick_metadata_researcher]
description = "Read-only researcher for exchange tick-size epochs, instrument metadata provenance, timestamps, and archival evidence."
config_file = "agents/tick-metadata-researcher.toml"

[agents.market_microstructure_auditor]
description = "Read-only market-microstructure auditor for order representation, spread, gaps, partial fills, queue assumptions, and OHLC ambiguity."
config_file = "agents/market-microstructure-auditor.toml"

[agents.backtest_engineer]
description = "Deterministic backtest infrastructure engineer; implements runners only after frozen specs and must not tune from financial outcomes."
config_file = "agents/backtest-engineer.toml"

[agents.cost_funding_auditor]
description = "Read-only auditor for fees, slippage, funding, cost normalization, and exchange-realism assumptions."
config_file = "agents/cost-funding-auditor.toml"

[agents.statistics_robustness_analyst]
description = "Read-only statistical analyst for uncertainty, concentration, stability, robustness partitions, and sample adequacy."
config_file = "agents/statistics-robustness-analyst.toml"

[agents.oos_forward_validator]
description = "Read-only OOS/forward-validation auditor for contamination, embargo, preregistration, chronology, and qualification gates."
config_file = "agents/oos-forward-validator.toml"

[agents.no_lookahead_auditor]
description = "Read-only specialist for timestamp causality, future leakage, prefix mutation, field provenance, and outcome isolation."
config_file = "agents/no-lookahead-auditor.toml"

[agents.overfit_red_team]
description = "Independent red-team reviewer focused on hidden tuning, multiple testing, subgroup mining, narrative overfit, and false qualification."
config_file = "agents/overfit-red-team.toml"

[agents.final_independent_reviewer]
description = "Final independent gate reviewer; challenges evidence, reproducibility, safety, and PASS/STOP decisions without modifying strategy rules."
config_file = "agents/final-independent-reviewer.toml"

[agents.venue_researcher]
description = "Parallel read-only venue researcher. Assign one worker per exchange to collect official fees, product identity, public data/API capability, metadata, order types and access evidence without ranking manipulation."
config_file = "agents/venue-researcher.toml"

[agents.api_reliability_auditor]
description = "Read-only auditor for REST/WebSocket availability, latency, rate limits, outage/status behavior, geo/access restrictions and retry/failover semantics."
config_file = "agents/api-reliability-auditor.toml"

[agents.exchange_security_auditor]
description = "Read-only exchange/API security auditor for permission granularity, secret handling, IP allowlists, withdrawal separation, signing and operational attack surface."
config_file = "agents/exchange-security-auditor.toml"

[agents.exchange_adapter_architect]
description = "Architecture specialist for a unified exchange abstraction and venue adapters; preserves strategy core and prevents exchange-specific leakage into product/domain layers."
config_file = "agents/exchange-adapter-architect.toml"

[agents.platform_backend_architect]
description = "Backend/platform architect for balances, positions, orders, scanner, journal, stats, API connections, multi-user isolation and exchange-agnostic service boundaries."
config_file = "agents/platform-backend-architect.toml"

[agents.devops_observability_engineer]
description = "Infrastructure specialist for CI, collectors, scheduling, append-only evidence, monitoring, alerting, backups, deployment safety and reproducibility."
config_file = "agents/devops-observability-engineer.toml"

[agents.risk_controls_auditor]
description = "Independent safety reviewer for portfolio risk caps, leverage/margin constraints, kill switches, exchange-side protection, duplicate prevention and fail-closed behavior."
config_file = "agents/risk-controls-auditor.toml"
